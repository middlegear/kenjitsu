name: Release & Docker Publish

on:
workflow_dispatch:

permissions:
contents: write
issues: write
pull-requests: write
packages: write

jobs:
release:
name: Semantic Release & Docker Publish
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "24"

  - name: Install pnpm
    run: npm install -g pnpm

  - name: Install dependencies
    run: pnpm install --no-frozen-lockfile

  - name: Run Semantic Release
    id: semantic
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      node --input-type=module <<'EOF'
      import semanticRelease from 'semantic-release';
      import { appendFileSync } from 'node:fs';

      const result = await semanticRelease(
        {},
        {
          cwd: process.cwd(),
          env: process.env,
        },
      );

      const output = process.env.GITHUB_OUTPUT;

      if (!result) {
        console.log('No new release was published.');
        appendFileSync(output, 'released=false\n');
        process.exit(0);
      }

      const version = result.nextRelease.version;
      const tag = result.nextRelease.gitTag;

      console.log(`Released version: ${version}`);
      console.log(`Release tag: ${tag}`);

      appendFileSync(output, `released=true\n`);
      appendFileSync(output, `version=${version}\n`);
      appendFileSync(output, `tag=${tag}\n`);
      EOF

  - name: Set up Docker Buildx
    if: steps.semantic.outputs.released == 'true'
    uses: docker/setup-buildx-action@v3

  - name: Log in to GHCR
    if: steps.semantic.outputs.released == 'true'
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Build & Push Docker Image
    if: steps.semantic.outputs.released == 'true'
    uses: docker/build-push-action@v6
    with:
      context: .
      push: true
      cache-from: type=gha
      cache-to: type=gha,mode=max
      tags: |
        ghcr.io/${{ github.repository_owner }}/kenjitsu:latest
        ghcr.io/${{ github.repository_owner }}/kenjitsu:${{ steps.semantic.outputs.version }}
      build-args: |
        NPM_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}

